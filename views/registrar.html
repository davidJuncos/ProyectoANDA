<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Usuario</title>
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <div class="logo">
          <img src="../img/logo.png" alt="Logo de la empresa" />
        </div>
        <h2>Registrar nuevo usuario</h2>

        <div id="mensaje" class="mensaje"></div>

        <form id="registrarForm">
          <input
            type="text"
            name="nombre_usuario"
            placeholder="Nombre de usuario"
            required
          />
          <input
            type="email"
            name="email"
            placeholder="Correo electrónico"
            required
          />
          <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required
          />

          <button type="submit">Registrar</button>
        </form>

        <p><a href="/">Volver al login</a></p>
      </div>
    </div>

    <script>
      const registrarForm = document.getElementById("registrarForm");
      const mensajeDiv = document.getElementById("mensaje");

      registrarForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(registrarForm);
        const data = Object.fromEntries(formData.entries());

        const res = await fetch("/registrar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const result = await res.text();
        mensajeDiv.innerHTML = result;
      });
    </script>
  </body>
</html>
